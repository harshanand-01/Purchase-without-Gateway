<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classyfi-Shop | Class With Classyfi</title>
<meta name="description" content="Trending clothes from Classyfi-Shop, Greater Noida. Order online, we confirm on WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14213d;--paper:#f6f7fb;--card:#fff;--brass:#d9a23b;--brass-d:#a8761a;--mute:#5d6578;--line:#e1e4ee;--ok:#1f8a5b;--wa:#25d366;--bad:#c0392b}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.5;padding-bottom:90px}
h1,h2,h3{font-family:'Bricolage Grotesque','DM Sans',sans-serif;line-height:1.15}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
header{background:var(--ink);color:#fff;padding:28px 18px 24px;text-align:center}
header h1{font-size:clamp(2rem,8vw,3.2rem);font-weight:800;letter-spacing:-.02em}
header h1 span{color:var(--brass)}
.tag{font-family:'Bricolage Grotesque',sans-serif;font-size:1.1rem;margin-top:6px;color:#dfe3f0}
.meta{margin-top:10px;font-size:.88rem;color:#aab2c8}
.meta a{color:#fff;text-decoration:none;border-bottom:1px solid var(--brass)}
.filters{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);display:flex;gap:8px;overflow-x:auto;padding:12px 14px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:99px;border:1.5px solid var(--ink);font-weight:500;font-size:.92rem;transition:background .2s,color .2s}
.chip[aria-pressed=true]{background:var(--ink);color:#fff}
main{max-width:1100px;margin:0 auto;padding:16px 12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}}
@media(min-width:980px){.grid{grid-template-columns:repeat(4,1fr)}}
.p{background:var(--card);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
.p img{width:100%;aspect-ratio:4/5;object-fit:cover;background:#e9ebf3;display:block}
.pb{padding:10px 11px 12px;display:flex;flex-direction:column;gap:3px;flex:1}
.cat{font-size:.74rem;color:var(--brass-d);font-weight:700}
.p h3{font-size:1rem;font-weight:600}
.d{font-size:.82rem;color:var(--mute);flex:1}
.pr{font-weight:700;font-size:1.1rem;margin-top:4px}
.add{margin-top:8px;background:var(--ink);color:#fff;padding:10px;border-radius:8px;font-weight:700;font-size:.92rem;transition:transform .15s,background .2s}
.add:active{transform:scale(.95)}
.add.done{background:var(--ok)}
.fab{position:fixed;right:16px;z-index:30;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;box-shadow:0 6px 18px rgba(20,33,61,.35)}
#cartBtn{bottom:16px;background:var(--brass);color:var(--ink)}
#waBtn{bottom:88px;background:var(--wa)}
.fab svg{width:28px;height:28px}
#count{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;padding:0 5px;border-radius:99px;background:var(--ink);color:#fff;font-size:.75rem;font-weight:700;display:grid;place-items:center}
#count.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.5)}}
.shade{position:fixed;inset:0;background:rgba(10,15,30,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.shade.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:50;left:0;right:0;bottom:0;max-height:92vh;background:#fff;border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .3s ease;display:flex;flex-direction:column;max-width:560px;margin:0 auto;visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.sh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.sh h2{font-size:1.3rem}
.x{font-size:1.6rem;line-height:1;padding:4px 10px}
.sb{overflow-y:auto;padding:6px 18px 14px}
.empty{padding:36px 0;text-align:center;color:var(--mute)}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0;border-bottom:1px solid var(--line);animation:in .25s}
@keyframes in{from{opacity:0;transform:translateX(14px)}}
.row b{font-weight:600}
.row small{color:var(--mute);display:block}
.sub{font-weight:700;text-align:right}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:34px;height:34px;border-radius:8px;border:1.5px solid var(--ink);font-weight:700;font-size:1.1rem}
.qty span{min-width:28px;text-align:center;font-weight:700}
.rm{color:var(--bad);font-size:.85rem;text-decoration:underline;justify-self:end;align-self:center}
.sf{padding:14px 18px 18px;border-top:1px solid var(--line)}
.tot{display:flex;justify-content:space-between;font-size:1.2rem;font-weight:700;margin-bottom:12px}
.btn{display:block;width:100%;padding:14px;border-radius:10px;background:var(--brass);color:var(--ink);font-weight:700;font-size:1rem;text-align:center;text-decoration:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.wa{background:var(--wa);margin-top:10px}
label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
input,textarea{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:#fff}
input:focus,textarea:focus{border-color:var(--ink);outline:0}
.err{color:var(--bad);font-size:.85rem;margin-top:10px}
.ok{text-align:center;padding:26px 6px}
.ok h2{margin:10px 0}
.tick{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;font-size:2rem;display:grid;place-items:center;margin:0 auto;animation:bump .5s}
footer{text-align:center;color:var(--mute);font-size:.85rem;padding:20px 14px}
.hp{position:absolute;left:-9999px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <h1>Classyfi<span>-Shop</span></h1>
  <p class="tag">Class With Classyfi</p>
  <p class="meta">Greater Noida · <a href="tel:+919818699396">9818699396</a></p>
</header>

<nav class="filters" id="filters" aria-label="Product categories"></nav>
<main><div class="grid" id="grid"></div></main>
<footer>Orders are confirmed on WhatsApp before delivery. Final price and availability are confirmed by the shop.<br>© Classyfi-Shop, Greater Noida</footer>

<a class="fab" id="waBtn" href="https://wa.me/919818699396?text=Hi%20Classyfi-Shop%2C%20I%20want%20to%20know%20more" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">
  <svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.2 14c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.100-1.500-1.100-2.800s.7-2 1-2.300c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 1.900c.1.2.1.4 0 .5l-.4.6c-.1.2-.3.3-.1.6.2.3.8 1.300 1.700 2 1.100 1 2.100 1.300 2.400 1.400.3.1.5.1.6-.1l.9-1.100c.2-.3.4-.2.6-.1l1.800.9c.3.1.5.2.5.3.1.2.1.8-.1 1.300z"/></svg>
</a>
<button class="fab" id="cartBtn" aria-label="Open cart">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6 5 3H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>
  <span id="count">0</span>
</button>

<div class="shade" id="shade"></div>

<section class="sheet" id="cart" role="dialog" aria-modal="true" aria-label="Your cart">
  <div class="sh"><h2>Your cart</h2><button class="x" data-close aria-label="Close cart">×</button></div>
  <div class="sb" id="items"></div>
  <div class="sf">
    <div class="tot"><span>Grand total</span><span id="grand">₹0</span></div>
    <button class="btn" id="orderBtn">Place order</button>
  </div>
</section>

<section class="sheet" id="checkout" role="dialog" aria-modal="true" aria-label="Checkout">
  <div class="sh"><h2>Your details</h2><button class="x" data-close aria-label="Close">×</button></div>
  <div class="sb" id="coBody">
    <form id="form" novalidate>
      <input class="hp" type="text" name="_honey" tabindex="-1" autocomplete="off">
      <label for="fn">Name *</label><input id="fn" required autocomplete="name">
      <label for="fp">Phone number *</label><input id="fp" type="tel" inputmode="tel" required autocomplete="tel">
      <label for="fa">Delivery address *</label><textarea id="fa" rows="3" required autocomplete="street-address"></textarea>
      <label for="fi">Special instructions (optional)</label><textarea id="fi" rows="2"></textarea>
      <p class="err" id="err" role="alert"></p>
      <div class="tot" style="margin-top:14px"><span>Total</span><span id="coTotal">₹0</span></div>
      <button class="btn" id="send" type="submit">Send order</button>
    </form>
  </div>
</section>

<script>
/* ============ EDIT HERE ============ */
const SHOP = {name:'Classyfi-Shop', phone:'919818699396', email:'harshanand825@gmail.com'};
// Replace each image URL with your direct imgbb link (https://i.ibb.co/xxxxx/name.jpg)
const PRODUCTS = [
 {id:1,name:'Classic White Shirt',price:799,cat:'Shirts',img:'https://i.ibb.co/xxxxx/white-shirt.jpg',desc:'Crisp cotton, all-day comfort'},
 {id:2,name:'Slim Fit Check Shirt',price:899,cat:'Shirts',img:'https://i.ibb.co/xxxxx/check-shirt.jpg',desc:'Smart casual check pattern'},
 {id:3,name:'Graphic Oversized Tee',price:599,cat:'T-Shirts',img:'https://i.ibb.co/xxxxx/oversized-tee.jpg',desc:'Trending drop-shoulder fit'},
 {id:4,name:'Plain Round-Neck Tee',price:349,cat:'T-Shirts',img:'https://i.ibb.co/xxxxx/plain-tee.jpg',desc:'Soft 100% cotton basic'},
 {id:5,name:'Blue Denim Jeans',price:1299,cat:'Bottoms',img:'https://i.ibb.co/xxxxx/denim.jpg',desc:'Stretch denim, straight fit'},
 {id:6,name:'Cargo Joggers',price:999,cat:'Bottoms',img:'https://i.ibb.co/xxxxx/cargo.jpg',desc:'Relaxed fit with deep pockets'},
 {id:7,name:'Zip-Up Hoodie',price:1499,cat:'Winterwear',img:'https://i.ibb.co/xxxxx/hoodie.jpg',desc:'Fleece-lined and warm'},
 {id:8,name:'Bomber Jacket',price:1899,cat:'Winterwear',img:'https://i.ibb.co/xxxxx/bomber.jpg',desc:'Street-style lightweight jacket'},
 {id:9,name:'Floral Kurti',price:849,cat:'Ethnic',img:'https://i.ibb.co/xxxxx/kurti.jpg',desc:'Printed rayon, festive ready'},
 {id:10,name:'Cotton Kurta Set',price:1399,cat:'Ethnic',img:'https://i.ibb.co/xxxxx/kurta.jpg',desc:'Kurta with matching pyjama'}
];
/* ================================= */

const $=s=>document.querySelector(s);
const inr=n=>'₹'+n.toLocaleString('en-IN');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PH='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"><rect width="400" height="500" fill="#e9ebf3"/><text x="200" y="255" font-family="sans-serif" font-size="22" fill="#8a91a6" text-anchor="middle">Classyfi</text></svg>');

let cart=[],active='All';
try{cart=JSON.parse(localStorage.getItem('classyfi_cart'))||[]}catch(e){cart=[]}
const save=()=>{try{localStorage.setItem('classyfi_cart',JSON.stringify(cart))}catch(e){}};
const total=()=>cart.reduce((s,i)=>s+i.price*i.qty,0);

function renderFilters(){
  const cats=['All',...new Set(PRODUCTS.map(p=>p.cat))];
  $('#filters').innerHTML=cats.map(c=>`<button class="chip" aria-pressed="${c===active}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
}
function renderGrid(){
  $('#grid').innerHTML=PRODUCTS.filter(p=>active==='All'||p.cat===active).map(p=>`
  <article class="p">
    <img src="${esc(p.img)}" alt="${esc(p.name)} - ${esc(p.desc)}" loading="lazy" onerror="this.onerror=null;this.src=PH">
    <div class="pb"><span class="cat">${esc(p.cat)}</span><h3>${esc(p.name)}</h3><p class="d">${esc(p.desc)}</p>
    <div class="pr">${inr(p.price)}</div>
    <button class="add" data-add="${p.id}">Add to cart</button></div>
  </article>`).join('');
}
function renderCart(){
  const n=cart.reduce((s,i)=>s+i.qty,0);
  $('#count').textContent=n;
  $('#grand').textContent=$('#coTotal').textContent=inr(total());
  $('#orderBtn').disabled=!cart.length;
  $('#items').innerHTML=cart.length?cart.map(i=>`
   <div class="row"><div><b>${esc(i.name)}</b><small>${inr(i.price)} each</small></div><div class="sub">${inr(i.price*i.qty)}</div>
   <div class="qty"><button data-dec="${i.id}" aria-label="Decrease quantity">−</button><span>${i.qty}</span><button data-inc="${i.id}" aria-label="Increase quantity">+</button></div>
   <button class="rm" data-rm="${i.id}">Remove</button></div>`).join(''):'<p class="empty">Your cart is empty.<br>Add something you like.</p>';
}
function change(id,d){
  const i=cart.find(x=>x.id==id); if(!i)return;
  i.qty+=d; if(i.qty<1)cart=cart.filter(x=>x.id!=id);
  save();renderCart();
}
function openSheet(id){closeAll();$('#'+id).classList.add('on');$('#shade').classList.add('on')}
function closeAll(){document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('on'));$('#shade').classList.remove('on')}

document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.cat){active=t.dataset.cat;renderFilters();renderGrid()}
  else if(t.dataset.add){
    const p=PRODUCTS.find(x=>x.id==t.dataset.add),i=cart.find(x=>x.id==p.id);
    i?i.qty++:cart.push({id:p.id,name:p.name,price:p.price,qty:1});
    save();renderCart();
    const c=$('#count');c.classList.remove('bump');void c.offsetWidth;c.classList.add('bump');
    t.textContent='Added ✓';t.classList.add('done');
    setTimeout(()=>{t.textContent='Add to cart';t.classList.remove('done')},900);
  }
  else if(t.dataset.inc)change(t.dataset.inc,1);
  else if(t.dataset.dec)change(t.dataset.dec,-1);
  else if(t.dataset.rm)change(t.dataset.rm,-999);
  else if(t.id==='cartBtn')openSheet('cart');
  else if(t.id==='orderBtn'&&cart.length)openSheet('checkout');
  else if('close' in t.dataset)closeAll();
});
$('#shade').onclick=closeAll;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});

function summary(){
  return cart.map((i,n)=>`${n+1}. ${i.name} | Qty: ${i.qty} | Price: ${inr(i.price)} | Subtotal: ${inr(i.price*i.qty)}`).join('\n')+'\n\nGRAND TOTAL: '+inr(total());
}
$('#form').addEventListener('submit',async e=>{
  e.preventDefault();
  const name=$('#fn').value.trim(),phone=$('#fp').value.trim(),addr=$('#fa').value.trim(),note=$('#fi').value.trim(),err=$('#err');
  err.textContent='';
  if(!cart.length){err.textContent='Your cart is empty.';return}
  if(!name||!phone||!addr){err.textContent='Please fill in your name, phone number and delivery address.';return}
  if(!/^[+\d][\d\s-]{8,14}$/.test(phone)){err.textContent='Enter a valid phone number.';return}
  if($('input[name=_honey]').value)return;
  const btn=$('#send');btn.disabled=true;btn.textContent='Sending…';
  const order=summary();
  const text=`NEW ORDER - ${SHOP.name}\n\nITEMS\n${order}\n\nCUSTOMER\nName: ${name}\nPhone: ${phone}\nAddress: ${addr}\nInstructions: ${note||'None'}`;
  try{
    const r=await fetch('https://formsubmit.co/ajax/'+SHOP.email,{
      method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},
      body:JSON.stringify({_subject:`New order from ${name} - ${inr(total())}`,_template:'box',_captcha:'false',
        'Customer Name':name,'Phone':phone,'Address':addr,'Instructions':note||'None',
        'Order Items':order,'Grand Total':inr(total()),message:text})
    });
    const j=await r.json();
    if(!r.ok||String(j.success)==='false')throw new Error(j.message||'failed');
    cart=[];save();renderCart();
    $('#coBody').innerHTML=`<div class="ok"><div class="tick">✓</div><h2>Order placed!</h2>
      <p>${SHOP.name} will contact you on WhatsApp to confirm.</p>
      <a class="btn wa" href="https://wa.me/${SHOP.phone}?text=${encodeURIComponent('Hi, I just placed an order. My name is '+name+'.')}" target="_blank" rel="noopener">Chat on WhatsApp</a>
      <button class="btn" style="margin-top:10px;background:var(--ink);color:#fff" data-close>Continue shopping</button></div>`;
  }catch(x){
    const why=location.protocol==='file:'?'Email orders only work once the site is hosted online (not opened from a file).':'The shop email may not be activated yet, or the connection failed.';
    err.innerHTML=`${why} You can <a href="https://wa.me/${SHOP.phone}?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">send this order on WhatsApp</a>.`;
    btn.disabled=false;btn.textContent='Send order';
  }
});

renderFilters();renderGrid();renderCart();
</script>
</body>
</html>
